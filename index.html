

<!DOCTYPE html>
<html>
<head>
<title>My Budget Tracker</title>
<style>
body{font-family:Arial;background:#e8f5e9;padding:20px}
.container{max-width:600px;margin:40px auto;background:white;padding:25px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.2)}
h1{background:#2e7d32;color:white;padding:15px;text-align:center;border-radius:10px}
input{padding:10px;margin:5px;border:1px solid #ccc;border-radius:6px}
button{padding:10px 20px;background:#2e7d32;color:white;border:none;border-radius:6px}
</style>
</head>
<body>
<div class="container">
<h1>My Budget Tracker</h1>
<p>Track your income and expenses</p>
<input id="n" placeholder="Expense Name">
<input id="a" type="number" placeholder="Amount">
<button onclick="add()">Add</button>
<h3>Your Expenses</h3>
<div id="list">No expenses yet</div>
</div>
<script>
function add(){
let name=document.getElementById('n').value;
let amount=document.getElementById('a').value;
let list=document.getElementById('list');
if(name && amount){
if(list.innerHTML=="No expenses yet") list.innerHTML="";
list.innerHTML+=`<p>✅ ${name} - $${amount}</p>`;
}
}
</script>
</body>
</html>
